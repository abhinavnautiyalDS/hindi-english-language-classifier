name: Train and publish classifier model

on:
  push:
    branches: [main]
    paths:
      - "data/sample.csv"
      - "src/**"
      - "train.py"
      - "requirements.txt"
      - ".github/workflows/train-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train, evaluate, and serialize model
        run: python train.py
      - name: Commit generated model and evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/language_classifier.joblib models/evaluation.json
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Add trained classifier model and evaluation"
            git push origin HEAD:main
          fi

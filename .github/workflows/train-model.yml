name: Train and publish classifier model

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "train.py"
      - "requirements.txt"
      - ".github/workflows/train-model.yml"
  workflow_dispatch:

concurrency:
  group: classifier-training-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and clean the dataset
        run: python scripts/build_dataset.py
      - name: Run tests
        run: python -m pytest -q
      - name: Train and evaluate models
        run: python train.py
      - name: Commit trained model, evaluation, and source attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/language_classifier.joblib models/evaluation.json DATASET_ATTRIBUTION_TATOEBA.tsv
          if git diff --cached --quiet; then
            echo "No model or attribution changes to commit."
          else
            git commit -m "Train classifier on curated Hindi-English corpora"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

name: Train and publish classifier models

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "train.py"
      - "train_binary.py"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/train-model.yml"
  workflow_dispatch:

concurrency:
  group: classifier-training-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and clean the dataset
        run: python scripts/build_dataset.py
      - name: Run tests
        run: python -m pytest -q
      - name: Train original three-class baseline
        run: python train.py
      - name: Train and compare binary English-Hinglish models
        run: python train_binary.py
      - name: Commit processed datasets, both models, evaluations, and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/language_classifier.joblib models/evaluation.json models/english_hinglish_classifier.joblib models/binary_evaluation.json DATASET_ATTRIBUTION_TATOEBA.tsv data/processed/train.csv data/processed/test.csv data/processed/dataset_audit.json
          if git diff --cached --quiet; then
            echo "No dataset, model, evaluation, or attribution changes to commit."
          else
            git commit -m "Publish curated datasets and trained Hindi-English classifiers"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
